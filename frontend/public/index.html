<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XSS Attack Lab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
    #root { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <script type="text/babel" src="/XssLab_v2.jsx"></script>
  <script type="text/babel">
    const renderApp = () => {
      if (!window.React || !window.ReactDOM || !window.XSSLab) {
        requestAnimationFrame(renderApp);
        return;
      }
      const root = window.ReactDOM.createRoot(document.getElementById('root'));
      root.render(window.React.createElement(window.XSSLab));
    };
    renderApp();
  </script>
</body>
</html>
