events {
    worker_connections 1024;
}

http {
    # Rate limiting for DDoS protection
    limit_req_zone $binary_remote_addr zone=limit:10m rate=100r/s;
    limit_req_status 429;

    # Upstream backend groups (each student container)
    upstream student1_backend {
        server backend-student1:5000;
    }

    upstream student2_backend {
        server backend-student2:5000;
    }

    upstream student3_backend {
        server backend-student3:5000;
    }

    upstream student4_backend {
        server backend-student4:5000;
    }

    upstream student5_backend {
        server backend-student5:5000;
    }

    # HTTP Server Block
    server {
        listen 80;
        server_name localhost;
        client_max_body_size 10M;

        # Route based on path prefix: /student{N}/*
        location ~ ^/student1/(.*)$ {
            limit_req zone=limit burst=200 nodelay;
            proxy_pass http://student1_backend/$1;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host backend-student1:5000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Student-ID student1;
            proxy_cache_bypass $http_upgrade;
        }

        location ~ ^/student2/(.*)$ {
            limit_req zone=limit burst=200 nodelay;
            proxy_pass http://student2_backend/$1;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host backend-student2:5000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Student-ID student2;
            proxy_cache_bypass $http_upgrade;
        }

        location ~ ^/student3/(.*)$ {
            limit_req zone=limit burst=200 nodelay;
            proxy_pass http://student3_backend/$1;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host backend-student3:5000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Student-ID student3;
            proxy_cache_bypass $http_upgrade;
        }

        location ~ ^/student4/(.*)$ {
            limit_req zone=limit burst=200 nodelay;
            proxy_pass http://student4_backend/$1;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host backend-student4:5000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Student-ID student4;
            proxy_cache_bypass $http_upgrade;
        }

        location ~ ^/student5/(.*)$ {
            limit_req zone=limit burst=200 nodelay;
            proxy_pass http://student5_backend/$1;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host backend-student5:5000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Student-ID student5;
            proxy_cache_bypass $http_upgrade;
        }

        # Default route - landing page
        location / {
            return 200 "XSS Attack Lab - Multi-Student Environment\n\nAccess your instance at:\n- /student1/\n- /student2/\n- /student3/\n- /student4/\n- /student5/\n";
            add_header Content-Type text/plain;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }
}
